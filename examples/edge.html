<!doctype html>
<html lang="en">
<head>
<title>Edge cases</title>
<META NAME="Description" CONTENT="How to bake bread at home, step by step, each day.">
<!-- A meta tag in a comment is not a meta tag:
<meta name="description" content="Short.">
-->
<script>
// A meta tag written in a script string is not a meta tag either:
var markup = '<meta name="description" content="Short.">';
</script>
</head>
<body>
<p>Hello, world.</p>
</body>
</html>
